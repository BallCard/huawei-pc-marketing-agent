<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>华章有据 · Logo</title>
  <link rel="icon" href="/static/brand/app-icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#25241f;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}.sheet{min-height:100dvh;max-width:880px;margin:auto;padding:30px;display:grid;grid-template-rows:auto 1fr auto}.heading{font-size:12px;color:#77746b;padding-bottom:20px;border-bottom:1px solid #dedcd2;display:flex;justify-content:space-between}.heading a{color:inherit;text-decoration:none}.identity{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:54px;padding:70px 0}.wordmark{display:block;width:min(100%,520px);height:auto}.marks{display:flex;align-items:center;gap:28px}.mark{width:36px;height:36px}.app-icon{width:54px;height:54px;border:1px solid #dedcd2;border-radius:13px}.downloads{display:flex;justify-content:center;gap:25px;border-top:1px solid #dedcd2;padding:23px 0 4px;font-size:12px}.downloads a{color:#77746b;text-decoration:none}.downloads a:hover{color:#b35f42}@media(max-width:500px){.sheet{padding:24px}.identity{padding:55px 0;gap:40px}.downloads{gap:22px;font-size:11px}}
  </style>
</head>
<body>
  <main class="sheet">
    <header class="heading"><span>华章有据 / Logo</span><a href="/#create">进入创作室 ↗</a></header>
    <section class="identity" aria-label="Logo 方案">
      <img class="wordmark" src="wordmark.svg" alt="华章有据，书页与引用点组成的横向字标" width="320" height="104">
      <div class="marks"><img class="mark" src="logo-mark.svg" alt="独立图形" width="36" height="36"><img class="app-icon" src="app-icon.svg" alt="应用图标" width="54" height="54"></div>
    </section>
    <nav class="downloads" aria-label="下载 Logo"><a href="wordmark.svg" download>字标 SVG</a><a href="logo-mark.svg" download>图形 SVG</a><a href="app-icon.svg" download>应用图标 SVG</a></nav>
  </main>
</body>
</html>
