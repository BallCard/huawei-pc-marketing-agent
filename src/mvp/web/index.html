<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f7f3">
  <title>华章有据</title>
  <meta name="application-name" content="华章有据">
  <link rel="icon" type="image/svg+xml" href="/static/brand/app-icon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/platforms.css">
  <link rel="stylesheet" href="/static/platforms-fixes.css">
  <link rel="stylesheet" href="/static/studio.css?v=handoff-2">
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- Lucide outline icons, ISC license: https://lucide.dev/license -->
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="m16 3 5 5M4 20l4-1 13-13a2.1 2.1 0 0 0-5-3L3 16l-1 6Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Zm0 0v6h6M8 13h8m-8 4h6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-poster" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h6m-6 4h6m-6 6h3"/></symbol>
  </svg>
  <header class="site-header">
    <a href="#create" class="brand" aria-label="华章有据首页"><img class="brand-mark" src="/static/brand/logo-mark.svg" width="29" height="29" alt=""><b>华章有据</b></a>
    <nav class="page-nav" aria-label="工作台页面" role="tablist">
      <button id="tab-create" type="button" role="tab" data-page="create" aria-controls="page-create" aria-selected="true">创作简报</button>
      <button id="tab-process" type="button" role="tab" data-page="process" aria-controls="page-process" aria-selected="false" tabindex="-1">生成过程<span class="nav-indicator" hidden></span></button>
      <button id="tab-work" type="button" role="tab" data-page="work" aria-controls="page-work" aria-selected="false" tabindex="-1">图文作品</button>
      <button id="tab-evidence" type="button" role="tab" data-page="evidence" aria-controls="page-evidence" aria-selected="false" tabindex="-1">事实核验</button>
    </nav>
  </header>
  <main id="workspace" class="workspace">
    <section id="page-create" class="page page-create" role="tabpanel" aria-labelledby="tab-create" tabindex="0">
      <div class="intro">
        <h1>好产品，<br>值得一个好故事。</h1>
        <svg class="studio-sketch" viewBox="0 0 420 240" fill="none" aria-hidden="true">
          <g stroke="#37372f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="m60 158 43-114 195 11-23 117Z" fill="#eeede5"/><path d="m70 153 39-101 179 11-20 99Z" fill="#f8f7f3"/>
            <path d="m60 158-32 27 209 24 38-37-215-14Z" fill="#eeede5"/><path d="m28 185 2 7 205 24 40-37v-7M93 165l119 11m-127-2 117 12m-55-13-5 9m-30-12-5 9m69-6-4 10M116 190l50 5"/>
            <path d="m146 99 27 2m-29 8 86 5m-89 5 70 4m-73 6 46 2" stroke="#a9a79a"/>
            <path d="m287 113 51-10 36 82-52 12-35-84Z" fill="#f8f7f3"/><path d="m301 124 27-5m-23 14 27-5m-23 14 15-3m-4 18 24-5" stroke="#a9a79a"/>
            <path d="m343 74 27-25m-22 19 7 7m12-23 7 7m-31 15-3 8 8-2 26-26-5-5-26 25Z"/><path d="m81 208 6 1m196 7 50 4m-6-18 14 1" stroke="#c7c5b9"/>
          </g><g stroke="#c16b4d" stroke-width="2.8" stroke-linecap="round"><path d="m318 34 1-15m-11 20-12-6m29 9 14 2m-19 5 5 13m-19-14-9 8"/></g>
        </svg>
      </div>
      <div id="task-panel" class="brief">
        <div class="brief-top"><button id="open-presets" type="button" class="text-button">试试示例 <span aria-hidden="true">↗</span></button></div>
        <h2>这次，想为谁写？</h2>
        <div class="input-modes" role="tablist" aria-label="场景输入方式"><button id="mode-structured" type="button" role="tab" data-input-mode="structured" aria-selected="true" aria-controls="structured-fields">选择场景</button><button id="mode-sentence" type="button" role="tab" data-input-mode="sentence" aria-selected="false" aria-controls="sentence-fields" tabindex="-1">说一句话</button></div>
        <form id="task-form" class="task-form">
          <div id="structured-fields" class="mode-fields" role="tabpanel" aria-labelledby="mode-structured"><div class="field-pair">
            <div class="form-group"><label for="audience">写给谁看</label><input id="audience" list="audienceList" value="大学新生" placeholder="选择或输入人群" autocomplete="off"><datalist id="audienceList"><option value="大学新生"><option value="经常出差的职场人"><option value="摄影与设计创作者"><option value="准备给孩子换电脑的家长"><option value="职场新人"></datalist></div>
            <div class="form-group"><label for="scenario">发生在什么场景</label><input id="scenario" list="sceneList" value="开学季" placeholder="选择或输入场景" autocomplete="off"><datalist id="sceneList"></datalist></div>
          </div></div>
          <div id="sentence-fields" class="mode-fields" role="tabpanel" aria-labelledby="mode-sentence" hidden><label class="sr-only" for="scene-description">一句话描述创作场景</label><textarea id="scene-description" rows="3" placeholder="比如：给经常背电脑去图书馆的大学新生，写一篇突出便携和接口的小红书笔记，邀请他们到店试试。"></textarea></div>
          <div class="form-group"><div class="label-row"><label for="product">电脑型号（选填）</label></div><input id="product" list="modelList" placeholder="留空自动推荐" autocomplete="off"><datalist id="modelList"></datalist></div>
          <fieldset class="platform-field"><legend>准备发布到哪里</legend><select id="platform" class="sr-only" aria-label="发布平台" tabindex="-1"><option value="xiaohongshu">小红书</option><option value="wechat_article">公众号</option><option value="moments">朋友圈</option><option value="poster">门店海报</option></select><div class="platform-options" role="group" aria-label="选择发布平台">
            <button type="button" data-platform="xiaohongshu" aria-pressed="true"><svg class="icon"><use href="#i-book"/></svg><span>小红书</span></button>
            <button type="button" data-platform="wechat_article" aria-pressed="false"><svg class="icon"><use href="#i-file"/></svg><span>公众号</span></button>
            <button type="button" data-platform="moments" aria-pressed="false"><svg class="icon"><use href="#i-grid"/></svg><span>朋友圈</span></button>
            <button type="button" data-platform="poster" aria-pressed="false"><svg class="icon"><use href="#i-poster"/></svg><span>门店海报</span></button>
          </div></fieldset>
          <div class="brief-options"><button id="open-options" class="text-button" type="button"><svg class="icon"><use href="#i-sliders"/></svg>内容偏好</button></div>
          <p id="form-error" class="form-error" role="alert" hidden></p>
          <div class="form-action"><button id="go" class="btn-primary" type="submit"><span class="btn-text">开始创作</span><svg class="icon"><use href="#i-arrow"/></svg></button></div>
        </form>
      </div>
    </section>
    <section id="page-process" class="page page-process" role="tabpanel" aria-labelledby="tab-process" tabindex="0" hidden>
      <div class="page-heading"><div><h2 id="process-title">好内容，需要一点默契。</h2></div><button id="view-result" class="btn-secondary" type="button" data-nav="work" hidden>查看作品 <svg class="icon"><use href="#i-arrow"/></svg></button></div>
      <div class="process-meta"><div id="runbar" class="runbar" aria-live="polite" hidden></div></div>
      <div id="need" class="need-container" aria-live="polite"></div>
      <div id="dbg-flow" class="process-content"><div id="flow"></div></div>
      <div class="process-footer"><div class="process-progress" role="progressbar" aria-label="生成进度" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0"><span id="process-progress-fill"></span></div><span id="progress-count">0 / 8</span></div>
    </section>
    <section id="page-work" class="page page-work" role="tabpanel" aria-labelledby="tab-work" tabindex="0" hidden>
      <div id="work-empty" class="empty-state"><svg class="empty-icon"><use href="#i-pen"/></svg><h2>还没有作品</h2><button type="button" class="btn-secondary" data-nav="create">去写创作简报 <svg class="icon"><use href="#i-arrow"/></svg></button></div>
      <div id="stage" class="stage-container" hidden>
        <div class="stage-bar"><div id="stage-title" class="stage-title-group"><b></b><span></span></div><div class="stage-actions"><button id="copy" class="btn-secondary" type="button"><svg class="icon"><use href="#i-copy"/></svg><span>复制正文</span></button><button id="dl" class="btn-secondary" type="button"><svg class="icon"><use href="#i-download"/></svg><span>导出 HTML</span></button></div></div>
        <div id="notice" class="notice-strip" role="status"></div><div class="work-body"><aside class="work-summary"><h2 id="result-platform">图文预览</h2><p id="result-model" class="result-model"></p><div id="chips" class="chips-container" aria-label="核验摘要"></div><button type="button" class="text-button" data-nav="evidence">查看事实与审核 <svg class="icon"><use href="#i-arrow"/></svg></button></aside><div class="preview-backdrop"><div id="preview" class="preview-stage"></div></div></div>
        <div id="revise" class="revise-bar" hidden><label for="instr">再打磨一下</label><input id="instr" type="text" placeholder="例如：语气更生活化，多写一点图书馆里的使用场景"><button id="redo" class="btn-primary" type="button">修改作品 <svg class="icon"><use href="#i-arrow"/></svg></button></div>
      </div>
    </section>
    <section id="page-evidence" class="page page-evidence" role="tabpanel" aria-labelledby="tab-evidence" tabindex="0" hidden>
      <div class="page-heading"><div><h2>每一句，都有据可查。</h2></div><button type="button" class="text-button" data-nav="work">返回作品 <svg class="icon"><use href="#i-arrow"/></svg></button></div>
      <div id="evidence-empty" class="empty-state"><svg class="empty-icon"><use href="#i-book"/></svg><h3>还没有核验记录</h3><button type="button" class="btn-secondary" data-nav="create">开始一次创作</button></div>
      <div id="insights" class="insights" hidden>
        <div class="insight-tabs" role="tablist" aria-label="核验内容"><button id="insight-tab-evidence" type="button" role="tab" data-insight="evidence" aria-controls="insight-evidence" aria-selected="true">事实与配图</button><button id="insight-tab-judge" type="button" role="tab" data-insight="judge" aria-controls="insight-judge" aria-selected="false" tabindex="-1">选型逻辑</button><button id="insight-tab-verify" type="button" role="tab" data-insight="verify" aria-controls="insight-verify" aria-selected="false" tabindex="-1">审核记录</button></div>
        <div id="insight-evidence" class="insight-pane" role="tabpanel" aria-labelledby="insight-tab-evidence" tabindex="0"><section id="dbg-evidence" hidden><div class="insight-caption"><h3>引用的产品事实与图片</h3><span id="ev-sum"></span></div><div id="evidence" class="dbg-content"></div></section></div>
        <div id="insight-judge" class="insight-pane" role="tabpanel" aria-labelledby="insight-tab-judge" tabindex="0" hidden><section id="dbg-judge" hidden><div class="insight-caption"><h3>为什么这样选、这样写</h3></div><div id="judge" class="dbg-content"></div></section></div>
        <div id="insight-verify" class="insight-pane" role="tabpanel" aria-labelledby="insight-tab-verify" tabindex="0" hidden><section id="dbg-verify" hidden><div class="insight-caption"><h3>事实核验与独立审核</h3><span id="vf-sum"></span></div><div id="verify" class="dbg-content"></div></section></div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="presets-dialog" class="studio-dialog" aria-labelledby="presets-title"><div class="dialog-heading"><div><h2 id="presets-title">场景示例</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭示例"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="presets" class="presets-grid"></div></dialog>
  <dialog id="options-dialog" class="studio-dialog options-dialog" aria-labelledby="options-title"><div class="dialog-heading"><div><h2 id="options-title">内容偏好</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭内容偏好"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="options-fields"><div class="form-group"><label for="goal">希望读者看完做什么</label><input id="goal" placeholder="例如：到店体验、私信咨询；留空由场景决定"></div><div class="form-group"><label for="constraints">有哪些不能写的内容</label><input id="constraints" value="不要提价格" placeholder="用逗号分隔，例如：不要提价格，不编造使用经历"></div><div class="form-group"><label for="extra">还有什么想补充</label><textarea id="extra" rows="3" placeholder="真实痛点、语气偏好，或希望优先突出的卖点"></textarea></div><div class="form-group"><label for="speed">创作档位</label><select id="speed"><option value="quality">质量优先</option><option value="fast">快速创作</option></select></div><button id="save-options" class="btn-primary" type="button">保存偏好 <svg class="icon"><use href="#i-check"/></svg></button></div></dialog>
  <dialog id="step-dialog" class="studio-dialog" aria-labelledby="step-dialog-title"><div class="dialog-heading"><div><p id="step-dialog-meta" class="section-label"></p><h2 id="step-dialog-title"></h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭执行详情"><svg class="icon"><use href="#i-close"/></svg></button></div><p id="step-dialog-note" class="dialog-copy"></p><div id="step-dialog-body" class="step-dialog-body"></div></dialog>
  <!-- Bump the progress asset versions together when changing the handoff UI. -->
  <script src="/static/dom.js"></script><script src="/static/flow-playback.js?v=handoff-2"></script><script src="/static/flow.js?v=handoff-2"></script><script src="/static/preview.js"></script><script src="/static/preview-xhs.js"></script><script src="/static/preview-wx.js"></script><script src="/static/preview-mm.js"></script><script src="/static/preview-poster.js"></script><script src="/static/studio.js"></script><script src="/static/app.js?v=handoff-2"></script>
</body>
</html>
