<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>华为 PC 营销软文智能体 | 营销图文创作工作台</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/platforms.css">
  <link rel="stylesheet" href="/static/platforms-fixes.css">
  <link rel="stylesheet" href="/static/views.css">
  <link rel="stylesheet" href="/static/flow-vertical.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-group">
        <div class="brand-emblem" aria-hidden="true">
          <span>HUAWEI PC</span>
        </div>
        <div class="brand-titles">
          <h1 class="brand-title">营销软文智能体</h1>
          <p class="brand-sub">基于事实知识库与多 Agent 协同编排的原生平台图文生成系统</p>
        </div>
      </div>
      <div id="status" class="status-indicator" aria-live="polite">
        <span class="status-dot"></span>
        <span class="status-label">工作台就绪</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside id="task-panel" class="task-panel" aria-label="创作任务配置">
      <div class="panel-header">
        <div class="panel-meta-title">任务定义</div>
        <h2 class="panel-headline">创作要素与边界约束</h2>
      </div>

      <form id="task-form" class="task-form" onsubmit="return false;">
        <div class="form-group">
          <div class="label-row">
            <label for="product">目标机型</label>
            <span class="field-hint">支持型号搜索或需求自适应</span>
          </div>
          <input type="text" id="product" list="modelList" placeholder="例：HUAWEI MateBook 14（鸿蒙版）" autocomplete="off">
          <datalist id="modelList"></datalist>
        </div>

        <div class="form-row-dual">
          <div class="form-group">
            <div class="label-row">
              <label for="audience">目标受众</label>
            </div>
            <input type="text" id="audience" placeholder="例：大学新生 / 职场白领" value="大学新生">
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="scenario">核心场景</label>
            </div>
            <input type="text" id="scenario" list="sceneList" placeholder="例：开学季 / 移动办公" value="开学季" autocomplete="off">
            <datalist id="sceneList"></datalist>
          </div>
        </div>

        <div class="form-row-dual">
          <div class="form-group">
            <div class="label-row">
              <label for="platform">发布平台</label>
            </div>
            <select id="platform">
              <option value="xiaohongshu" selected>小红书 (Xiaohongshu)</option>
              <option value="wechat_article">微信公众号长文 (Article)</option>
              <option value="moments">微信朋友圈 (Moments)</option>
              <option value="poster">门店展示海报 (Poster)</option>
            </select>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="goal">传播目标</label>
            </div>
            <input type="text" id="goal" placeholder="例：引导到店体验咨询" value="引导到店咨询真机支持">
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="speed">生成档位</label>
            <span class="field-hint">写作/审核用哪一档模型</span>
          </div>
          <select id="speed">
            <option value="quality" selected>质量优先 · 写作 high（约 40–60 秒）</option>
            <option value="fast">极速演示 · 全部 low（约 15–25 秒）</option>
          </select>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="constraints">硬性限制</label>
            <span class="field-hint">英文或中文逗号分隔</span>
          </div>
          <input type="text" id="constraints" placeholder="例：不要提价格, 勿编造跑分, 强调接口齐全" value="不要提价格">
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="extra">补充诉求与细节偏好</label>
          </div>
          <textarea id="extra" rows="3" placeholder="填写消费者的真实痛点、个人使用偏好或希望优先突出的卖点维度...">经常背去图书馆，希望轻一点，多提接口和自习续航表现</textarea>
        </div>

        <div class="form-action">
          <button id="go" class="btn-primary" type="button">
            <span class="btn-text">启动 Agent 生成图文</span>
            <span class="btn-arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </form>

      <div class="presets-section">
        <div class="presets-header">
          <span class="presets-title">经典测试样例</span>
          <span class="presets-note">点击可快速填入典型创作场景</span>
        </div>
        <div id="presets" class="presets-grid"></div>
      </div>
    </aside>

    <section id="out" class="stage-section" aria-label="营销图文生成结果与平台预览">
      <div id="runbar" class="runbar" hidden></div>

      <div id="need" class="need-container" aria-live="polite"></div>

      <div id="stage" class="stage-container" hidden>
        <div class="stage-bar">
          <div id="stage-title" class="stage-title-group">
            <b></b>
            <span></span>
          </div>
          <div class="stage-actions">
            <button id="copy" class="btn-secondary" type="button">
              <svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="5" y="5" width="8" height="8" rx="1.5"></rect>
                <path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H11"></path>
              </svg>
              <span>复制正文</span>
            </button>
            <button id="dl" class="btn-secondary" type="button">
              <svg class="btn-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M8 2v8.5m0 0 3-3m-3 3-3-3M3 13.5h10"></path>
              </svg>
              <span>导出 HTML</span>
            </button>
          </div>
        </div>

        <div id="notice" class="notice-strip" role="alert"></div>

        <div class="preview-backdrop">
          <div id="preview" class="preview-stage"></div>
        </div>

        <div id="chips" class="chips-container" aria-label="核验结果摘要"></div>
      </div>

      <div id="revise" class="revise-bar" hidden>
        <div class="revise-inner">
          <label for="instr" class="revise-label">协同修订</label>
          <input type="text" id="instr" placeholder="输入追加修改指令（例如：语气再生活化一点、重点突出转接线痛点）...">
          <button id="redo" class="btn-primary btn-sm" type="button">按此指令迭代</button>
        </div>
      </div>

      <div class="debug-accordions">
        <details id="dbg-flow" class="dbg" hidden>
          <summary>
            <div class="dbg-summary-head">
              <span class="dbg-badge">流水线</span>
              <span class="dbg-title">Agent 编排与执行追踪</span>
            </div>
            <em id="flow-sum" class="dbg-summary-meta"></em>
          </summary>
          <div id="flow" class="dbg-content"></div>
        </details>

        <details id="dbg-judge" class="dbg" hidden>
          <summary>
            <div class="dbg-summary-head">
              <span class="dbg-badge">决策层</span>
              <span class="dbg-title">场景认知、需求权重与型号选定</span>
            </div>
            <em></em>
          </summary>
          <div id="judge" class="dbg-content"></div>
        </details>

        <details id="dbg-evidence" class="dbg" hidden>
          <summary>
            <div class="dbg-summary-head">
              <span class="dbg-badge">事实依据</span>
              <span class="dbg-title">知识库引证事实与配图资产登记</span>
            </div>
            <em id="ev-sum" class="dbg-summary-meta"></em>
          </summary>
          <div id="evidence" class="dbg-content"></div>
        </details>

        <details id="dbg-verify" class="dbg" hidden>
          <summary>
            <div class="dbg-summary-head">
              <span class="dbg-badge">审校层</span>
              <span class="dbg-title">确定性事实核验与独立模型审查</span>
            </div>
            <em id="vf-sum" class="dbg-summary-meta"></em>
          </summary>
          <div id="verify" class="dbg-content"></div>
        </details>
      </div>
    </section>
  </main>

  <script src="/static/dom.js"></script>
  <script src="/static/flow.js"></script>
  <script src="/static/preview.js"></script>
  <script src="/static/preview-xhs.js"></script>
  <script src="/static/preview-wx.js"></script>
  <script src="/static/preview-mm.js"></script>
  <script src="/static/preview-poster.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
