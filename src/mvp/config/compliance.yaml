# 合规规则表：底稿为知识库 P6-营销素材库/08-合规/售后与促销表述红线.md 与手册合规要求。
# 命中即进入“改写/删除”流程；规则分三档：block（必须处理）、dynamic（价格促销类，受 price_policy 约束）。
rules:
  - rule: 绝对化用语
    kind: block
    pattern: '最好|最强|最佳|最低价|最便宜|最轻|最薄|最快|第一|唯一|全网最|绝对|万能|完美|碾压|吊打|颠覆|震撼|遥遥领先|零风险|史上|顶级|极致|100%(?!\s*sRGB)|不会卡|永不|一定能|所有软件'
  - rule: 虚假承诺
    kind: block
    pattern: '无条件|终身|永久|全部兼容|任何(?:软件|设备|外设)|包治|保证(?:续航|性能|兼容)|免费上门|售后无忧'
  - rule: 无依据竞品贬低
    kind: block
    pattern: '比.{0,6}(?:差|烂|慢|重)|不如|被.{0,4}吊打|竞品.{0,6}(?:垃圾|落后)'
  - rule: 虚构体验评价
    kind: block
    pattern: '亲测|我用了|用了[一二三四五六七八九十\d]+(?:天|周|个月|年)|入手后|自用|真实体验|实测'
  - rule: 价格误导或动态促销
    kind: dynamic
    pattern: '国补|补贴|优惠|立减|限时|秒杀|赠品|折扣|到手价|抢购|仅剩|库存|最后\d+台|直降|劲省'

# 事实性数值检查时忽略的“小整数 + 非单位”模式不在这里配置，见 verify.py
