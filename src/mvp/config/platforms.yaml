# 平台策略表：来源为知识库 P6-营销素材库/02-平台模板 与 docs/PROBLEM.md 的平台规格。
# 改这里即可调整四个平台的结构、图数、字数、语气、引导方式，无需改代码。
wechat_article:
  name: 微信公众号
  reader: 订阅或转发而来的读者，愿意读完，想弄清一件事再决定是否咨询
  images: [2, 4]
  chars: [1200, 2200]
  max_facts: 14
  price_default: conditional
  structure:
    - 标题备选 3 个，标题只承载一个矛盾或结果
    - 导语 80-150 字，还原人物与场景
    - 正文 3-5 章，每章“卡点—动作—证据—限制”，先写用户动作再出现功能名
    - 每 180-250 字配一张有信息作用的图
    - 结尾只给一个行动引导（查兼容、预约体验或咨询）
  tone: 叙事清晰、克制专业，允许有场景叙事，但不得编造用户经历
  cta_style: 一个动作：携带自己的软件和外设来核对，或预约体验
  tags: false
xiaohongshu:
  name: 小红书
  reader: 刷到就想收藏的年轻用户，三秒内决定是否读下去
  images: [3, 6]
  chars: [300, 800]
  max_facts: 8
  price_default: forbid
  structure:
    - 口语化标题，避免堆叠感叹号和空泛形容词
    - 首句给结果或冲突，短段落
    - 每段对应一个使用场景和一个已核验事实
    - 倒数第二段写一个限制或取舍
    - 结尾给收藏清单或评论区提问，附 3-6 个话题标签
  tone: 口语化、第二人称与清单式；不得伪造个人体验，禁止“亲测/我用了/入手后/自用”，用“适合/可以这样用/建议你先核对”
  cta_style: 引导收藏核对清单或在评论区说出自己的软件与预算
  tags: true
moments:
  name: 门店朋友圈
  reader: 门店老客户与周边人群，低打扰，看三秒
  images: [1, 3]
  chars: [80, 180]
  max_facts: 3
  price_default: forbid
  structure:
    - 第一句点出人群和任务
    - 只讲一个核心卖点，配一条边界说明
    - 最后邀请对方私聊发需求或到店核对
  tone: 熟人口吻，不刷屏，最多一组 emoji
  cta_style: 一个入口：私聊发来常用软件和预算，或到店核对
  tags: false
poster:
  name: 门店海报
  reader: 到店顾客，站在展台前几秒内扫读
  images: [1, 1]
  chars: [60, 220]
  max_facts: 3
  price_default: forbid
  structure:
    - 主标题 12-22 字
    - 副标题一句话点明人群与任务
    - 不超过 3 个核心卖点，每个卖点一行，参数脚注紧跟
    - 一行活动说明：价格与活动以当前官方渠道为准
  tone: 短句、可扫读，不堆形容词
  cta_style: 扫码或向店员咨询（不写具体二维码内容）
  tags: false
