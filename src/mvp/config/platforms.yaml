# 平台原生短营销图文；风格依据与产品取舍见 docs/writing-style.md。
# 改这里即可调整四个平台的结构、图数、字数、语气、引导方式，无需改代码。
wechat_article:
  name: 微信公众号
  reader: 手机里浏览品牌图文的读者，逐张看图、顺着短句读下去
  images: [2, 4]
  chars: [240, 480]
  max_facts: 4
  writing_limits: {title: 24, lead: 40, text_block: 85, cta: 30, caption: 30}
  price_default: conditional
  structure:
    - 品牌短图文，不是评测、选购指南或新闻长文；标题只表达一个场景收益
    - 导语 1-2 句直接进入场景，20-40 字；不要写人物背景或问题分析
    - 单列向下阅读，图片与短文交替，围绕 2-3 个最相关的亮点展开
    - 每张图旁只用 2-4 行短句；每个 text 块不超过 85 字，可用换行形成阅读节奏
    - 每个亮点只挑一个能解释用处的事实；版本、兼容等必要条件用一句紧随相应主张
    - 最后只给一句行动引导；不写总结段、参数清单或长篇购机建议
  tone: 品牌口吻，短句、自然、有画面感；先讲使用动作与好处，再给必要事实，少用转折分析和概念解释，不编造体验
  cta_style: 一个动作：携带自己的软件和外设来核对，或预约体验
  tags: false
xiaohongshu:
  name: 小红书
  reader: 刷到就想收藏的年轻用户，三秒内决定是否读下去
  images: [3, 6]
  chars: [100, 220]
  max_facts: 2
  writing_limits: {title: 20, lead: 35, text_block: 55, cta: 30, caption: 30}
  price_default: forbid
  structure:
    - 标题不超过 20 字，点出一个具体场景或好处；不要写成评测或选购避坑标题
    - 首句 15-35 字直接说场景或诉求，不铺垫一大段购买背景
    - 正文 3-4 个短段，每段 1-2 句、最多 55 字；只讲 2 个最相关的亮点
    - 一个亮点配一个有用的事实；不要把屏幕、尺寸、接口、续航、系统参数全部罗列
    - 必要的型号版本和兼容边界用一句简短提醒，别把待确认清单写进帖子
    - 结尾一句轻量互动或到店邀请，附 3-5 个相关话题；正文不重复标题、导语或图注
  tone: 像门店编辑分享一个好用的选择，短句、口语、轻松；可少量用 emoji 分段，不写论文式长句，不用“首先其次综上”；不虚构第一人称实测
  cta_style: 引导收藏核对清单或在评论区说出自己的软件与预算
  tags: true
moments:
  name: 门店朋友圈
  reader: 门店老客户与周边人群，低打扰，看三秒
  images: [1, 3]
  chars: [40, 90]
  max_facts: 3
  writing_limits: {title: 20, lead: 25, text_block: 40, cta: 25, caption: 24}
  price_default: forbid
  structure:
    - 总共 3-5 个短行，像门店发给熟客的一条动态，不写小作文
    - 第一句点出场景；只讲一个核心卖点，保留必要的版本或适配条件
    - 最后一句私聊或到店邀请，不叠加多个转化动作
  tone: 熟人口吻，不刷屏，最多一组 emoji
  cta_style: 一个入口：私聊发来常用软件和预算，或到店核对
  tags: false
poster:
  name: 门店海报
  reader: 到店顾客，站在展台前几秒内扫读
  images: [1, 1]
  chars: [35, 100]
  max_facts: 3
  writing_limits: {title: 16, lead: 25, text_block: 35, cta: 20, caption: 24}
  price_default: forbid
  structure:
    - 主标题 8-16 字
    - 副标题一句话点明人群与任务
    - 不超过 2 个核心卖点，每个卖点一行，必要的版本条件紧跟
    - 一行活动说明：价格与活动以当前官方渠道为准
  tone: 短句、可扫读，不堆形容词
  cta_style: 扫码或向店员咨询（不写具体二维码内容）
  tags: false
