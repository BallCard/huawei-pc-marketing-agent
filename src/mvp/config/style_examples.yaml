# 编辑示范，不是产品事实。禁止从样例中借用参数或能力。
xiaohongshu:
  - aspect: 切入
    bad: 这款电脑兼具出色性能与轻薄设计，是大学生活的理想伙伴。
    good: 课本已经够重了，去图书馆的电脑还想轻一点。
  - aspect: 事实与节奏
    bad: 轻薄、高清、长续航、强大接口，一步到位。
    good: 一段讲一个任务。写携带就给有条件的重量；写接外设就用对应接口证据。
wechat_article:
  - aspect: 场景
    bad: 随着数字化时代的发展，高效办公成为现代职场人的核心需求。
    good: 下一场会议前，先把要展示的资料准备好。
  - aspect: 节奏
    bad: 首先介绍屏幕，其次分析性能，最后总结它的综合实力。
    good: 短段落与图片交替。每个亮点先讲使用动作，再给一项相关证据。
moments:
  - aspect: 重点
    bad: 屏幕性能续航接口全面升级，欢迎收藏转发私信到店体验。
    good: 只讲一个熟客会在意的任务，结尾只留一个咨询入口。
  - aspect: 口吻
    bad: 我亲测一周，所有课程软件都能流畅运行。
    good: 把常用软件清单发来，选机前逐项核对。
poster:
  - aspect: 扫读
    bad: 旗舰性能、全能体验、震撼升级，学习办公娱乐一机搞定。
    good: 一个任务做标题，两行有证据的卖点，一句到店邀请。
  - aspect: 条件
    bad: 所有配置都轻到超乎想象。
    good: 使用具体配置的资料时，把配置和约数紧贴数据。
